limit_req_zone $binary_remote_addr zone=awr_control:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=awr_data:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=awr_long_lived:10m;

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;

    access_log off;
    error_log /var/log/nginx/relay.example.com.error.log warn;
    client_max_body_size 16k;
    limit_req_status 429;
    limit_conn_status 429;

    location = /api/v1/messages/stream {
        limit_req zone=awr_data burst=20 nodelay;
        limit_conn awr_long_lived 8;
        error_page 429 = @data_rate_limited;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/android/replies {
        limit_req zone=awr_data burst=20 nodelay;
        limit_conn awr_long_lived 8;
        error_page 429 = @data_rate_limited;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/android/messages {
        client_max_body_size 24m;
        limit_req zone=awr_data burst=20 nodelay;
        error_page 429 = @data_rate_limited;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/subscription {
        limit_req zone=awr_control burst=10 nodelay;
        error_page 429 = @control_rate_limited;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/test-push {
        limit_req zone=awr_control burst=10 nodelay;
        error_page 429 = @control_rate_limited;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/pairings {
        limit_req zone=awr_control burst=10 nodelay;
        error_page 429 = @control_rate_limited;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/android/pair {
        limit_req zone=awr_control burst=10 nodelay;
        error_page 429 = @control_rate_limited;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        limit_req zone=awr_data burst=20 nodelay;
        error_page 429 = @data_rate_limited;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @control_rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        return 429 '{"error":"RATE_LIMITED"}';
    }

    location @data_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"RATE_LIMITED"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
